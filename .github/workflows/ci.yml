name: CI

# The suite is hermetic: every case either stops in argument parsing before any HID call,
# or asserts against the source text. Nothing here needs a Magic Mouse, and nothing here
# writes to a device — so it runs unprivileged on a stock runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Lint (clang static analyzer)
        run: make lint

      - name: Test
        run: make test

      - name: Shell syntax
        run: |
          for f in scripts/*.sh tests/run.sh Comece-aqui.command Desinstalar.command; do
            bash -n "$f"
          done

      - name: LaunchDaemon plist is well-formed
        run: plutil -lint launchd/com.local.magicmousefix.plist
