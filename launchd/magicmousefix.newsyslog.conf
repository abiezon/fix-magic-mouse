# Log rotation for the magicmousefix daemon, installed to
# /etc/newsyslog.d/magicmousefix.conf. Without it /var/log/magicmousefix.log is never
# rotated by anything.
#
# logfilename                   [owner:group]  mode count size(KB) when  flags
/var/log/magicmousefix.log      root:wheel     644  3     256      *     J
